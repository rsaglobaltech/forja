name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  forja:
    name: forja (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # What forja generates must build and pass its own tests: one combination per backend.
  generated:
    needs: forja
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [spring, quarkus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # No Maven cache: the pom.xml does not exist until the project is generated.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci && npm run build
      - name: Generar un proyecto completo (PostgreSQL, OAuth2, ArchUnit, web, extras)
        run: node "$GITHUB_WORKSPACE/dist/cli.js" init demo --yes --backend ${{ matrix.backend }} --java-package com.acme.demo --skip-git
        working-directory: ${{ runner.temp }}
      - name: Tests del proyecto generado (API + web)
        run: npm test
        working-directory: ${{ runner.temp }}/demo
      # A stale pin fails here, not in the user's first `specgate quality
      # baseline`: Spring Boot 4.1.1 gave a new project 18 known
      # vulnerabilities (truck-flote, F16). The same BOM and scanner as
      # Specgate's strict quality checks; the Quarkus pom skips deploy, which
      # CycloneDX would otherwise read as "no BOM".
      - name: Known vulnerabilities in the generated project's dependencies
        run: |
          (cd apps/api && ./mvnw -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DoutputFormat=json -DoutputName=bom -Dcyclonedx.skipNotDeployed=false)
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.2.4 \
            scan source -L apps/api/target/bom.json -L package-lock.json
        working-directory: ${{ runner.temp }}/demo

  # The generated project's npm scripts on Windows, where npm runs them with
  # cmd.exe: `./mvnw` failed there (truck-flote, F12). Testcontainers needs
  # Linux containers, so the architecture check and the web build run here,
  # not the whole suite.
  generated-windows:
    needs: forja
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [spring, quarkus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci && npm run build
      - name: Generate a project
        shell: bash
        run: node "$GITHUB_WORKSPACE/dist/cli.js" init demo --yes --backend ${{ matrix.backend }} --java-package com.acme.demo --skip-git
        working-directory: ${{ runner.temp }}
      - name: Architecture check through npm (cmd.exe)
        run: npm run arch
        working-directory: ${{ runner.temp }}/demo
      - name: Web build through npm (cmd.exe)
        run: npm run test:web
        working-directory: ${{ runner.temp }}/demo
